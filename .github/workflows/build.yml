#===============================================================================
# Weekly build: Linux, Windows and Android
#-------------------------------------------------------------------------------
# Proves every week that the game still builds on every platform, without
# anyone having to check it by hand (see docs/BUILDING.md):
#   linux    builds mkxp-z (`make mkxp`), compiles the PBS data headlessly and
#            packages the game: `make desktop` (Linux) and `make android` (the
#            game archive the Android app loads)
#   windows  builds mkxp-z with MSYS2 (lib/mkxp-z/windows) and packages it
#            with the compiled game folder from the linux job
#   android  builds the mkxp-z Android app for every ABI (`make apk`)
# The results are uploaded as artifacts of the run.
#
# Also runs when a pull request changes the build itself, and can be started by
# hand from the Actions tab (Run workflow).
#===============================================================================
name: Build

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build.yml
      - Makefile
      - game.sh
      - src/mkxp.json
      - src/Game.ini
      - src/loader.rb
      - tools/scripts/build_engine.sh
      - tools/scripts/build_apk.sh
      - tools/scripts/install_assets.sh
      - tools/scripts/extract_assets.sh
      - lib/mkxp-z/**

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_NAME: pokessentials

jobs:
  #-----------------------------------------------------------------------------
  # Linux engine + the game folder (desktop package and Android game archive)
  #-----------------------------------------------------------------------------
  linux:
    name: Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ruby build-essential cmake meson ninja-build pkg-config git autoconf automake libtool \
            bison nasm xxd wget libgl-dev libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libasound2-dev libpulse-dev libpixman-1-dev \
            libuchardet-dev libdbus-1-dev zlib1g-dev libbz2-dev libffi-dev libyaml-dev xorg-dev \
            xvfb xauth libgl1-mesa-dri libglx-mesa0 zip unzip
          python3 -m pip install Pillow

      - name: Restore the engine's dependencies
        uses: actions/cache@v4
        with:
          path: |
            lib/mkxp-z/linux/build-x86_64
            lib/mkxp-z/linux/downloads
          key: mkxp-linux-${{ hashFiles('lib/mkxp-z/linux/**', 'tools/scripts/build_engine.sh') }}

      - name: Build mkxp-z
        run: make mkxp

      - name: Install the Essentials assets
        run: tools/scripts/install_assets.sh

      - name: Build, compile and package for Linux
        run: make desktop

      - name: Package the game for Android
        run: make android

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_NAME }}-linux
          path: dist/${{ env.GAME_NAME }}-linux.tar.gz
          retention-days: 14
          compression-level: 0

      # Also used by the windows job as its game folder.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_NAME }}-android-game
          path: |
            dist/${{ env.GAME_NAME }}-android.zip
            dist/main.1.*.obb
          retention-days: 14
          compression-level: 0

  #-----------------------------------------------------------------------------
  # Windows engine, packaged with the compiled game folder
  #-----------------------------------------------------------------------------
  windows:
    name: Windows
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Keep LF line endings so the Makefiles and shell scripts work in MSYS2.
      - name: Disable line-ending conversion
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            base-devel
            bison
            git
            ruby
            vim
            zip
            unzip
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-gcc

      - name: Restore the engine's dependencies
        uses: actions/cache@v4
        with:
          path: |
            lib/mkxp-z/windows/build-mingw64
            lib/mkxp-z/windows/downloads
          key: mkxp-windows-${{ hashFiles('lib/mkxp-z/windows/Makefile', 'lib/mkxp-z/windows/vars.sh') }}

      # Like tools/scripts/build_engine.sh: fetch FluidSynth without its
      # ~570 MB test-data submodule, which the Makefile's clone would pull.
      - name: Download FluidSynth
        run: |
          dir=lib/mkxp-z/windows/downloads/mingw64/fluidsynth
          tag="$(grep -o 'FluidSynth/fluidsynth -b [^ ]*' lib/mkxp-z/windows/Makefile | awk '{print $3}')"
          if [[ -n "$tag" && ! -f "$dir/CMakeLists.txt" ]]; then
            rm -rf "$dir"
            git -c advice.detachedHead=false clone -q --depth 1 -b "$tag" https://github.com/FluidSynth/fluidsynth "$dir"
            git -C "$dir" submodule update -q --init --depth 1 gcem
          fi

      - name: Build the engine's dependencies
        run: |
          cd lib/mkxp-z/windows
          make

      - name: Build mkxp-z
        run: |
          cd lib/mkxp-z
          source windows/vars.sh
          meson setup build-windows
          ninja -C build-windows
          strip build-windows/mkxp-z.exe

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.GAME_NAME }}-android-game
          path: game-archive

      - name: Package the game
        run: |
          out="dist/$GAME_NAME"
          mkdir -p "$out"
          unzip -q "game-archive/$GAME_NAME-android.zip" -d "$out"
          deps=lib/mkxp-z/windows/build-mingw64
          cp lib/mkxp-z/build-windows/mkxp-z.exe "$out/"
          cp "$deps"/bin/x64-msvcrt-ruby*.dll "$out/"
          stdlib="$(find "$deps/lib/ruby" -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' | head -n1)"
          [[ -n "$stdlib" ]] || { echo "::error::Ruby's standard library wasn't built"; exit 1; }
          cp -r "$stdlib" "$out/stdlib"
          cp lib/mkxp-z/assets/LICENSE.mkxp-z-with-https.txt "$out/"
          # Bundle every MSYS2 DLL the engine and its DLLs load (e.g. zlib, which
          # MSYS2 now ships as libz-1.dll), until nothing new turns up.
          for pass in 1 2 3 4 5; do
            added=0
            for file in "$out"/*.exe "$out"/*.dll; do
              while read -r dll; do
                if [[ ! -e "$out/$(basename "$dll")" ]]; then
                  cp "$dll" "$out/"
                  echo "Bundled $(basename "$dll")"
                  added=1
                fi
              done < <(ldd "$file" | awk '$3 ~ "^/mingw64/" {print $3}')
            done
            [[ $added -eq 1 ]] || break
          done

      # Every DLL the engine needs must ship with it, not come from MSYS2.
      - name: Check for DLLs missing from the package
        run: |
          cd "dist/$GAME_NAME"
          missing=0
          for file in *.exe *.dll; do
            while IFS= read -r line; do
              name="$(echo "$line" | sed -e 's/=>/|/' | cut -d'|' -f1 | xargs)"
              where="$(echo "$line" | sed -e 's/=>/|/' | cut -d'|' -f2 | xargs)"
              case "$where" in
                "not found"*|/mingw64/*)
                  echo "::error::$file needs $name, which is missing from the package"
                  missing=1 ;;
              esac
            done < <(ldd "$file")
          done
          exit $missing

      - name: Zip the package
        run: |
          cd dist
          zip -qr -X "$GAME_NAME-windows.zip" "$GAME_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_NAME }}-windows
          path: dist/${{ env.GAME_NAME }}-windows.zip
          retention-days: 14
          compression-level: 0

  #-----------------------------------------------------------------------------
  # Android app (every ABI)
  #-----------------------------------------------------------------------------
  android:
    name: Android
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # Gradle 7.6 (lib/mkxp-z/android/gradle) runs on JDK 11 to 19.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27d
          add-to-path: false

      # The host Ruby that builds the Android Ruby. Not Ubuntu's: its RubyGems
      # is patched to install default gems into /var/lib/gems, which Ruby's
      # `make install` can't write to.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake meson ninja-build pkg-config git autoconf automake libtool \
            bison nasm xxd gperf

      - name: Restore the Android dependencies
        uses: actions/cache@v4
        with:
          path: lib/mkxp-z/android/deps
          key: mkxp-android-${{ steps.ndk.outputs.ndk-path }}-${{ hashFiles('lib/mkxp-z/android/deps/**', 'lib/mkxp-z/android/meson-*.txt') }}

      - name: Build the APK
        # The runner image presets these to its own NDK; point them all at ours.
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: make apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_NAME }}-android-apk
          path: dist/${{ env.GAME_NAME }}-debug.apk
          retention-days: 14
